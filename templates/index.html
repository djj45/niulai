<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>约牛聊天室{% if room_id %} · {{ room_id }}{% endif %}</title>
<style>
:root {
  --bg: #f5f5f5; --card: #ffffff; --border: #e0e0e0;
  --text: #333; --muted: #888; --accent: #d4380d;
  --teacher: #d4380d; --teacher-bg: #fff7f2;
  --me: #1da157; --me-bg: #f0fff4;
  --dm: #722ed1; --dm-bg: #f9f0ff;
  --hover: #f0f7ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
       background: var(--bg); color: var(--text); font-size: 14px; }

/* ===== 顶部栏 ===== */
.topbar { background: var(--card); border-bottom: 1px solid var(--border);
  padding: 8px 16px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100; flex-wrap: nowrap; }
.topbar > * { flex: none; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.topbar .title { font-size: 16px; font-weight: 600; white-space: nowrap; }
.topbar .room-name { color: var(--accent); font-weight: 600; max-width: 300px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar button, .topbar .btn { padding: 4px 12px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--card); cursor: pointer; font-size: 13px; white-space: nowrap; }
.topbar button:hover { background: var(--hover); border-color: var(--accent); }
.topbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.topbar .spacer { flex: 1; }
.topbar .cal-group { display: flex; align-items: center; gap: 4px; }
.topbar .cal-group .lbl { font-size: 12px; color: var(--muted); }
.topbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
.topbar input[type="date"] { padding: 3px 6px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 13px; }
.topbar .cal-group button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.topbar .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.dot.on { background: #0f9d58; box-shadow: 0 0 0 3px rgba(15,157,88,.15); }
.dot.err { background: #f5222d; }
.dot.warn { background: #faad14; }
#imText.on { color: #0f9d58; font-weight: 600; }
#imText.err { color: #f5222d; }
#imText.warn { color: #d48806; }
.warn-banner { display: none; background: #fffbe6; border-bottom: 1px solid #ffe58f;
  color: #874d00; font-size: 13px; padding: 6px 16px; }
.warn-banner.show { display: block; }
.warn-banner a { color: var(--accent); cursor: pointer; text-decoration: underline; }

/* 同步进度条 */
.sync-bar { display: none; background: #f0f5ff; border-bottom: 1px solid #d6e4ff;
  font-size: 12px; color: #1d39c4; }
.sync-bar.show { display: block; }
.sync-bar-inner { display: flex; align-items: center; gap: 10px; padding: 5px 16px; }
.sync-progress { flex: 1; height: 4px; background: #d6e4ff; border-radius: 2px; overflow: hidden;
  min-width: 80px; }
.sync-progress i { display: block; height: 100%; width: 0%; background: #1d39c4;
  transition: width .25s; }
.sync-bar button { padding: 1px 8px; border: 1px solid #adc6ff; background: #fff;
  border-radius: 3px; cursor: pointer; font-size: 12px; }

/* 顶部加载更早 / 底部到底提示 */
.list-top-hint { text-align: center; color: var(--muted); font-size: 12px; padding: 8px; }
.list-top-hint button { padding: 3px 14px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--card); cursor: pointer; font-size: 12px; }

/* ===== 主布局 ===== */
.main { display: flex; gap: 1px; height: calc(100vh - 49px); }
.main.with-banner { height: calc(100vh - 49px - 30px); }
.col { background: var(--card); display: flex; flex-direction: column; overflow: hidden; }
.col-left { width: 34%; min-width: 300px; border-right: 1px solid var(--border); }
.col-right { flex: 1; position: relative; }
.col-header { padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600;
  display: flex; align-items: center; gap: 8px; background: #fafafa; font-size: 13px; }
.col-header .count { color: var(--muted); font-weight: 400; font-size: 12px; }
.col-header .clear-btn { padding: 2px 10px; font-size: 12px; border: 1px solid var(--accent);
  color: var(--accent); background: var(--card); border-radius: 4px; cursor: pointer; display: none; margin-left: auto; }
.col-header .clear-btn.show { display: inline-block; }

/* ===== 消息 ===== */
.msg-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.msg { padding: 7px 12px; display: flex; gap: 8px; border-bottom: 1px solid #f6f6f6;
  content-visibility: auto;
  /* contain-intrinsic-size 先给固定估算（旧浏览器兼容），
     再给 auto 版本（现代浏览器会记住真实高度）；
     不这样做的话滚动时估算值被真实高度替换，scrollHeight 反复变 → 滚动条抽搐 */
  contain-intrinsic-size: 0 64px;
  contain-intrinsic-size: auto 64px; }
.msg:hover { background: var(--hover); }
.msg.teacher { background: var(--teacher-bg); }
.msg.teacher:hover { background: #ffefe5; }
.msg.dm { background: var(--dm-bg); }
.msg.is-new { animation: hl 1.6s ease; }@keyframes hl { 0% { background: #ffe58f; } 100% { background: transparent; } }
.msg .avatar { width: 36px; height: 36px; border-radius: 5px; flex-shrink: 0;
  object-fit: cover; background: #eee; cursor: pointer; }
.msg .avatar-ph { width: 36px; height: 36px; border-radius: 5px; flex-shrink: 0;
  background: #e8e8e8; display: flex; align-items: center; justify-content: center;
  color: #999; font-size: 14px; font-weight: 500; }
.msg .body { flex: 1; min-width: 0; }
.msg .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
.msg .nick { font-weight: 600; color: #1890ff; cursor: pointer; }
.msg .nick.teacher-name { color: var(--teacher); }
.msg .nick:hover { text-decoration: underline; }
.msg .yn { font-size: 11px; color: #bbb; }
.msg .time { font-size: 11px; color: var(--muted); }
.msg .tag { font-size: 10px; padding: 0 4px; border-radius: 2px; color: #fff; background: #1890ff; }
.msg .tag.t { background: var(--teacher); }
.msg .tag.r { background: #fa8c16; }
.msg .tag.p { background: #8c8c8c; }
.msg .alias-badge { font-size: 10px; background: #ffd666; color: #874d00;
  border-radius: 3px; padding: 0 3px; font-weight: 400; }
.msg .quote { font-size: 12px; color: var(--muted); background: #f5f5f5;
  border-left: 3px solid var(--border); padding: 3px 8px; margin: 2px 0 4px;
  border-radius: 0 3px 3px 0; cursor: pointer; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.msg .quote .q-nick { color: var(--accent); font-weight: 500; }
.msg .content { word-break: break-word; line-height: 1.65; white-space: pre-wrap; }
.msg .content mark { background: #fff3a0; padding: 0 1px; border-radius: 2px; }

/* msgType=2 文章推送卡片（视频列表也复用） */
.vcol { padding: 3px 10px; border: 1px solid var(--border); background: var(--bg);
  border-radius: 12px; font-size: 12px; cursor: pointer; color: var(--muted); }
.vcol.on { border-color: var(--accent); color: var(--accent); background: rgba(29,57,196,.12); }
/* 视频回放列表行：小缩略图 + 标题，紧凑排列 */
.vitem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; background: var(--card); }
.vitem:hover { border-color: var(--accent); }
.vitem img { width: 96px; height: 54px; object-fit: cover; border-radius: 4px; flex: none;
  background: #000; }
.vbody { flex: 1; min-width: 0; }
.vtitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vmeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.vplay { flex: none; width: 30px; height: 30px; line-height: 30px; text-align: center;
  border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; }
/* 置顶消息条（列表头下方） */
.pin-bar { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 10px;
  background: rgba(232,122,50,.10); border-bottom: 1px solid var(--border); font-size: 12px; }
.pin-badge { flex: none; cursor: pointer; font-weight: 600; }
.pin-curr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer; color: var(--muted); }
.pin-arrow { flex: none; cursor: pointer; color: var(--muted); }
.pin-panel { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 60;
  background: var(--card); border: 1px solid var(--border); border-top: 0;
  border-radius: 0 0 8px 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  max-height: 40vh; overflow-y: auto; }
.pin-item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.pin-item:last-child { border-bottom: 0; }
.pin-item:hover { background: var(--bg); }
.pin-item .pmeta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.msg .article-card { display: inline-flex; gap: 10px; max-width: 380px; margin: 3px 0;
  padding: 8px 10px; border: 1px solid #ffd8bf; border-left: 3px solid var(--teacher);
  border-radius: 5px; background: #fffaf7; }
.msg .article-card .ac-img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px;
  flex-shrink: 0; cursor: zoom-in; }
.msg .article-card .ac-body { min-width: 0; }
.msg .article-card .ac-tag { display: inline-block; font-size: 10px; color: #fff;
  background: var(--teacher); border-radius: 2px; padding: 0 4px; margin-bottom: 3px; }
.msg .article-card .ac-title { font-weight: 600; font-size: 13px; color: #ad2102;
  word-break: break-all; }
.msg .article-card .ac-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.msg .content .imgwrap { display: inline-block; max-width: 240px; margin: 3px 0; }
.msg .content img.msgimg { display: block; max-width: 240px; max-height: 320px;
  border-radius: 5px; cursor: zoom-in; background: #f0f0f0; }
.msg .content img.msgimg.loading { min-width: 120px; min-height: 90px; }
.msg.teacher .content { font-weight: 500; }

/* 日期分隔条：两条细线中间夹日期，一眼能看出读到哪天了 */
.day-sep { display: flex; align-items: center; gap: 10px; margin: 12px 14px 4px;
  font-size: 12px; color: var(--muted); }
.day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.day-sep span { white-space: nowrap; }

/* 曾用名弹窗 */
.nick-popup { position: fixed; background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; min-width: 180px; max-width: 320px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15); z-index: 9999; font-size: 12px; }
.nick-popup .pp-title { font-weight: 600; margin-bottom: 4px; color: var(--muted); }
.nick-popup .pp-item { padding: 2px 0; display: flex; gap: 8px; }
.nick-popup .pp-time { color: var(--muted); font-size: 11px; margin-left: auto; }

/* 搜索区 */
.search-box { padding: 8px 12px; background: #fafafa; border-bottom: 1px solid var(--border); }
.search-box .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
.search-box input { padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
.search-box input[type="text"] { flex: 1; min-width: 120px; }
.search-box button { padding: 3px 12px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--card); cursor: pointer; font-size: 13px; }
.search-box button:hover { background: var(--hover); border-color: var(--accent); }
.quick-times { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.quick-times button { padding: 2px 8px; font-size: 12px; }

/* 图片放大 */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
  z-index: 9999; justify-content: center; align-items: center; overflow: hidden; }
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 4px;
  transform-origin: center center; cursor: grab; user-select: none; -webkit-user-drag: none; }
.lightbox img.dragging { cursor: grabbing; }
.lightbox-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.6); font-size: 12px; pointer-events: none; }

/* 弹窗通用 */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
  z-index: 9000; justify-content: center; align-items: center; }
.modal .box { background: var(--card); border-radius: 8px; padding: 20px 24px;
  max-width: 460px; width: 92%; max-height: 84vh; overflow-y: auto;
  box-shadow: 0 4px 24px rgba(0,0,0,.2); }
.modal h3 { margin-bottom: 14px; font-size: 16px; }
.modal .field { margin-bottom: 12px; }
.modal .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.modal .field input, .modal .field textarea { width: 100%; padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 4px; font-size: 13px; font-family: inherit; }
.modal .field textarea { min-height: 70px; resize: vertical; word-break: break-all; }
.modal .field input:focus, .modal .field textarea:focus { outline: none; border-color: var(--accent); }
.modal .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.modal .msg { font-size: 12px; min-height: 16px; margin: 6px 0; color: var(--accent); }
.modal .msg.ok { color: var(--me); }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.modal .actions button { padding: 7px 18px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--card); cursor: pointer; font-size: 13px; }
.modal .actions .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal .actions button:disabled { opacity: .5; cursor: not-allowed; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal th, .modal td { padding: 4px 8px; text-align: right; border-bottom: 1px solid #f0f0f0; }
.modal th { color: var(--muted); font-weight: 400; }
.modal th:first-child, .modal td:first-child { text-align: left; }
.modal .kv { font-size: 13px; line-height: 1.9; }
.modal .kv b { color: var(--muted); font-weight: 400; display: inline-block; min-width: 84px; }

/* 新消息提示 */
.new-msg-hint { position: absolute; bottom: 96px; right: 14px; background: var(--accent);
  color: #fff; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); display: none; z-index: 10; }

/* 发送区 */
.send-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; align-items: center;
  border-top: 1px solid var(--border); background: var(--card); }
.send-box .img-preview { display: none; width: 100%; flex-wrap: wrap; gap: 6px; }
.send-box .img-preview.show { display: flex; }
.send-box .img-preview .thumb { position: relative; width: 72px; height: 72px; border-radius: 4px;
  border: 1px solid var(--border); overflow: hidden; }
.send-box .img-preview .thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.send-box .img-preview .thumb .rm { position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
  line-height: 14px; text-align: center; border-radius: 50%; background: rgba(0,0,0,.55);
  color: #fff; font-size: 11px; cursor: pointer; }
.send-box .upload-btn { cursor: pointer; font-size: 18px; user-select: none; padding: 2px 4px; border-radius: 4px; }
.send-box .upload-btn:hover { background: var(--hover); }
.send-box .upload-btn.uploading { opacity: .4; cursor: wait; }
.send-box textarea { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; font-family: inherit; resize: none; overflow-y: auto; line-height: 1.5;
  max-height: 7.5em; min-height: 2em; }
.send-box textarea:focus { outline: none; border-color: var(--accent); }
.send-box button { padding: 6px 18px; border: none; border-radius: 4px; background: var(--accent);
  color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap; }
.send-box button:disabled { opacity: .5; cursor: not-allowed; }
.loading { padding: 20px; text-align: center; color: var(--muted); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.9; }
</style>
<script src="/static/hls.min.js"></script>
</head>
<body>

<div class="topbar">
  <span class="title" title="约牛聊天室">📌 约牛</span>
  <span class="room-name" id="roomName">{{ room_id and ('#' + room_id|string) or '' }}</span>
  <span class="cal-group">
    <input type="date" id="datePicker" onchange="onDatePick()">
    <button onclick="shiftDay(-1)" title="前一天">◀</button>
    <button onclick="loadToday()" id="todayBtn">今天</button>
    <button onclick="shiftDay(1)" title="后一天">▶</button>
  </span>
  <span class="sep"></span>
  <button onclick="setRange(3)" data-range="3">近3天</button>
  <button onclick="setRange(7)" data-range="7">近7天</button>
  <button onclick="setRange(0)" data-range="0">全部</button>
  <span class="spacer"></span>
  <span class="status"><span class="dot" id="imDot"></span><span id="imText">初始化…</span></span>
  <button onclick="syncFull()" id="fullSyncBtn" title="全量同步：翻到最早">⏬ 全量</button>
  <button onclick="showVideos()" id="videoBtn" title="老师的视频课（栏目与回放），弹窗内直接播放">📺 视频</button>
  <button onclick="showArticles()" id="articleBtn" title="老师的全部研选文章，点击阅读">📚 文章</button>
  <button onclick="backupDB()">💾 备份</button>
  <button onclick="showStats()">📊 统计</button>
  <button onclick="logout()" id="logoutBtn" title="清掉本机保存的登录凭证（不影响消息库），回到登录页">🚪 退出</button>
</div>
<div class="sync-bar" id="syncBar">
  <div class="sync-bar-inner">
    <span id="syncText">同步中…</span>
    <div class="sync-progress"><i id="syncFill"></i></div>
    <button onclick="loadMessages()">停止刷新</button>
  </div>
</div>
<div class="warn-banner" id="warnBanner"></div>

<div class="main" id="main">
  <!-- 左栏：老师观点 -->
  <div class="col col-left">
    <div class="col-header">
      <span>🎓 老师观点</span>
      <span class="count" id="teacherCount">0 条</span>
    </div>
    <div class="msg-list" id="teacherList">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 右栏：全部消息 -->
  <div class="col col-right">
    <div class="search-box">
      <div class="row">
        <input type="text" id="searchInput" placeholder="🔍 搜索消息关键词…"
               onkeydown="onSearchKeydown(event)">
        <input type="text" id="userIdInput" placeholder="用户ID" style="width:88px">
        <button onclick="doSearch()">搜索</button>
        <button onclick="clearSearch()">清除</button>
        <span style="color:var(--muted);font-size:12px">日期</span>
        <input type="date" id="searchStart" style="width:130px">
        <span>~</span>
        <input type="date" id="searchEnd" style="width:130px">
      </div>
      <div class="row quick-times">
        <span style="color:var(--muted);font-size:12px">快捷定位</span>
        <button onclick="jumpTo('09:15')">9:15 集合竞价</button>
        <button onclick="jumpTo('09:30')">9:30 早盘</button>
        <button onclick="jumpTo('11:30')">11:30 午间</button>
        <button onclick="jumpTo('13:00')">13:00 午后</button>
        <button onclick="jumpTo('14:30')">14:30 尾盘</button>
        <button onclick="jumpTo('00:00')">回到顶部</button>
        <button onclick="scrollToBottom()">回到底部</button>
      </div>
    </div>
    <div class="col-header">
      <span id="allCount">全部 0 条</span>
      <span class="count" id="rangeHint"></span>
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕ 返回全部</button>
    </div>
    <!-- 置顶消息（房间级，pinnedListById）：首条摘要 + 展开面板 -->
    <div class="pin-bar" id="pinBar" style="display:none">
      <span class="pin-badge" onclick="togglePinPanel()">📌 <b id="pinCount">0</b></span>
      <div class="pin-curr" id="pinCurr" onclick="togglePinPanel()"></div>
      <span class="pin-arrow" onclick="togglePinPanel()">▾</span>
      <div class="pin-panel" id="pinPanel"></div>
    </div>
    <div class="msg-list" id="allList">
      <div class="loading">加载中…</div>
    </div>
    <div class="new-msg-hint" id="newMsgHint" onclick="scrollToBottom()">
      ↓ <span id="newMsgCount">0</span> 条新消息
    </div>
    <div class="send-box">
      <div class="img-preview" id="imagePreview"></div>
      <label class="upload-btn" id="uploadBtn">📎
        <input type="file" accept="image/*" id="fileInput" hidden onchange="uploadFile(this)">
      </label>
      <textarea id="sendInput" rows="1" maxlength="2000"

<script>
const INIT_ROOM = "{{ room_id|string if room_id else '' }}";
const TODAY = new Date();

// ===================== 全局状态 =====================
let allMessages = [];
let teacherMessages = [];
let searchMode = false;
let searchKeyword = "";
let myUserId = "";
let ws = null;
let wsRetry = 0;
let pendingNew = 0;
let stickToBottom = true;
let currentRangeDays = 0;         // 0 = 全部
let currentDay = "";              // 非空 = 正在通读某一天
let hasMoreHistory = false;       // 上面还有更早的消息
let oldestLoadedId = 0;           // 当前已加载的最旧消息 id（向历史翻页的游标）
let loadingOlder = false;
const seenKeys = new Set();
const avatarCache = {};
const nickCountCache = {};
const MSG_BATCH = 200;
const RENDER_ALL_MAX = 4000;       // 一次性能直接渲染的上限（一天 3136 条 → 一次渲染完，不再分批贴底）
const PAGE_LOAD = 1200;           // 范围模式首屏条数（最新优先）
const PAGE_OLDER = 1000;          // 每次向内加载更早的条数
const _renderStates = new Map();   // listId -> { msgs, list, index, observer, kw }

// ===================== 工具 =====================
function esc(s) {
  return (s == null ? "" : String(s))
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function fmtTime(dt) {
  if (!dt) return "";
  const p = dt.split(" ");
  return p[1] || dt;
}
function fmtDateTime(dt) { return dt || ""; }
function mediaUrl(u, kind) {
  if (!u) return "";
  return `/api/media?kind=${kind || "image"}&u=${encodeURIComponent(u)}`;
}
function avatarUrl(m) {
  const a = m.avatar_url || (m.raw && m.raw.avatarUrl) || "";
  return a ? mediaUrl(a, "avatar") : "";
}
function firstChar(s) { return esc((s || "?").trim()[0] || "?"); }
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
function dayLabel(d) {
  const p = (d || "").split("-");
  if (p.length < 3) return d || "";
  const w = WEEK[new Date(d + "T12:00:00").getDay()] || "";
  return `${p[0]} 年 ${Number(p[1])} 月 ${Number(p[2])} 日 · 星期${w}`;
}

/** 跨天时插一条日期分隔（聊天记录必需，否则只有时刻认不出是哪天） */
function appendDaySep(frag, date, state) {
  if (!date || state.lastDate === date) return;
  state.lastDate = date;
  const el = document.createElement("div");
  el.className = "day-sep";
  el.dataset.day = date;
  const s = document.createElement("span");
  s.textContent = dayLabel(date);
  el.appendChild(s);
  frag.appendChild(el);
}

function msgKey(m) {
  if (m.id) return "id:" + m.id;
  if (m.im_msg_seq) return "seq:" + m.im_msg_seq;
  return "t:" + (m.msg_date || "") + ":" + (m.nick_name || "") + ":" + (m.msg_content || "").slice(0, 40);
}
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 150) + "px";
}
function parseRange(sel) { return sel ? sel.replace(/-/g, "") : ""; }

// ===================== 消息渲染 =====================
/** msgType=2：文章推送卡片。
 *  msg_content = {title, brief, sourceId, sourceTime, sourceUrl, mainImageUrl}
 *  点卡片 → /api/article/{sourceId} 拉正文（网页版 queryArticleDetail 接口），
 *  在弹窗里阅读；卡片上的 sourceUrl（小程序 H5 路径）已过时不用。
 */
function renderArticle(m) {
  let a = {};
  try {
    a = typeof m.msg_content === "string" ? JSON.parse(m.msg_content || "{}")
                                           : (m.msg_content || {});
  } catch (e) { a = {}; }
  const title = a.title || a.brief || "";
  if (!title) return `<span style="color:var(--muted)">[文章]</span>`;
  const img = a.mainImageUrl ? mediaUrl(a.mainImageUrl, "image") : "";
  const meta = [a.sourceTime ? String(a.sourceTime).slice(0, 16) : "",
                a.sourceId ? "文章 #" + a.sourceId : ""].filter(Boolean).join(" · ");
  const clickable = a.sourceId ? `style="cursor:pointer" onclick="openArticle(${a.sourceId})"` : "";
  return `<div class="article-card" ${clickable}>
      ${img ? `<img class="ac-img" src="${img}" loading="lazy" onclick="event.stopPropagation();openLightbox('${img}')">` : ""}
      <div class="ac-body">
        ${a.brief ? `<span class="ac-tag">${esc(a.brief)}</span>` : ""}
        <div class="ac-title">${esc(title)}</div>
        <div class="ac-meta">${esc(meta)}</div>
      </div>
    </div>`;
}

/** 文章阅读弹窗：正文按 Word 富文本原样渲染在白底 iframe 里（图片为绝对地址可直读）。
 *  实现：每次打开都重建 iframe 元素，并用 blob URL 导航而不是 srcdoc——
 *  Chromium/Edge 对 sandbox+srcdoc 在同一元素上反复赋值有偶发不绘制的引擎
 *  bug（同一篇文章第二次点开一片空白），新元素 + blob 导航绕开它；
 *  seq 序号丢弃过期响应，避免慢的旧请求覆盖新点开的文章。 */
let _articleSeq = 0, _articleBlobUrl = null;
async function openArticle(articleId) {
  const seq = ++_articleSeq;
  const modal = document.getElementById("articleModal");
  document.getElementById("articleTitle").textContent = "加载中…";
  document.getElementById("articleMeta").textContent = `文章 #${articleId}`;
  document.getElementById("articlePdf").style.display = "none";
  modal.style.display = "flex";
  try {
    const r = await fetch(`/api/article/${articleId}`);
    const d = await r.json();
    if (seq !== _articleSeq) return;            // 已点开别的文章，丢弃过期响应
    if (d.error) throw new Error(d.error);
    document.getElementById("articleTitle").textContent = d.title || `文章 #${articleId}`;
    document.getElementById("articleMeta").textContent =
      `${d.createTime || ""} · ${d.feeStatus ? "付费" : "免费"}`;
    if (d.pdfUrl) {
      document.getElementById("articlePdf").href = d.pdfUrl;
      document.getElementById("articlePdf").style.display = "inline";
    }
    // 给正文补基础排版：限宽 + 图片自适应，避免 Word HTML 撑破弹窗
    const html = `<!doctype html><meta charset="utf-8">
      <style>body{margin:16px auto;max-width:680px;font:15px/1.7 -apple-system,"PingFang SC",sans-serif;color:#222;word-break:break-word}
      img{max-width:100%;height:auto} table{max-width:100%}</style>
      ${d.content || "<p>（无正文；PDF 型文章请点下方链接）</p>"}`;
    const body = document.getElementById("articleBody");
    body.innerHTML = "";
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "");
    frame.title = "文章正文";
    frame.style.cssText = "flex:1;width:100%;border:0;border-radius:6px;background:#fff";
    if (_articleBlobUrl) URL.revokeObjectURL(_articleBlobUrl);
    _articleBlobUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    frame.src = _articleBlobUrl;
    body.appendChild(frame);
  } catch (e) {
    if (seq !== _articleSeq) return;
    document.getElementById("articleTitle").textContent = "加载失败";
    document.getElementById("articleBody").innerHTML =
      `<div style="flex:1;color:#c00;padding:24px;font:14px system-ui">${esc(String(e))}</div>`;
  }
}
function closeArticle() { document.getElementById("articleModal").style.display = "none"; }

// ===================== 视频课（列表 + 弹窗内直接播放） =====================
const _videoState = { columnId: 0, page: 0, items: [], busy: false, done: false };
let _hls = null;

async function showVideos() {
  document.getElementById("videoModal").style.display = "flex";
  videoBackToList();
  if (!_videoState.items.length) {
    document.getElementById("videoList").innerHTML = '<div class="empty">加载中…</div>';
    await loadVideos();
  }
}

async function loadVideos(columnId, page = 1) {
  // 同栏目：防重复翻页 + 到底就停；换栏目：从第 1 页重来
  const switching = columnId !== undefined && columnId !== _videoState.columnId;
  if (_videoState.busy || (!switching && (_videoState.done || page <= _videoState.page))) return;
  _videoState.busy = true;
  try {
    const q = columnId ? `?column_id=${columnId}&page=${page}` : `?page=${page}`;
    let d;
    try {
      d = await (await fetch(`/api/videos${q}`)).json();
    } catch (e) { d = { error: String(e) }; }
    if (d.error) {
      document.getElementById("videoList").innerHTML = `<div class="empty">加载失败：${esc(d.error)}</div>`;
      return;
    }
    _videoState.columnId = d.columnId;
    _videoState.page = d.page || page;
    _videoState.done = (d.playbacks || []).length < 10;
  const cols = document.getElementById("videoCols");
  if (d.columns && d.columns.length && !cols.children.length) {
    cols.innerHTML = d.columns.map(c =>
      `<button class="vcol" data-id="${c.columnId}" onclick="loadVideos(${c.columnId})"
        title="${esc(c.name)}">${esc(c.name)}（${c.number || "?"}）</button>`).join("");
  }
  cols.querySelectorAll(".vcol").forEach(b =>
    b.classList.toggle("on", +b.dataset.id === d.columnId));
  _videoState.items = page > 1 ? _videoState.items.concat(d.playbacks || []) : (d.playbacks || []);
  document.getElementById("videoList").innerHTML = _videoState.items.length
    ? _videoState.items.map(v => `
      <div class="vitem" title="${esc(v.title)}" onclick="playVideo(${v.id}, ${v.teacherId})">
        <img src="${mediaUrl(v.coverImg, "image")}" loading="lazy" alt="">
        <div class="vbody">
          <div class="vtitle">${esc(v.title)}</div>
          <div class="vmeta">${esc((v.pubTime || "").slice(0, 16))} · #${v.id}
            ${v.feeStatus ? ' · <span class="ac-tag">付费</span>' : ""}</div>
        </div>
        <span class="vplay">▶</span>
      </div>`).join("")
    : '<div class="empty">这个栏目还没有回放</div>';
    // 首屏没撑出滚动条就自动补下一页（setTimeout 等 busy 释放后再进）
    const vbox = document.getElementById("videoList");
    if (vbox.clientHeight > 0 && vbox.scrollHeight <= vbox.clientHeight && !_videoState.done)
      setTimeout(() => loadVideos(_videoState.columnId, _videoState.page + 1), 0);
  } finally { _videoState.busy = false; }
}

/** 弹窗内播放：queryById 拿免签 m3u8（CORS 全开），hls.js 拉流，原生 controls 管播放/全屏 */
async function playVideo(id, teacherId) {
  const player = document.getElementById("videoPlayer");
  const el = document.getElementById("videoEl");
  document.getElementById("videoPlayTitle").textContent = "加载中…";
  document.getElementById("videoWebLink").href =
    `https://client.zx093.com/webktc/tougu/index.html?path=/video&id=${id}&teacherId=${teacherId}`;
  document.getElementById("videoListWrap").style.display = "none";
  player.style.display = "flex";
  try {
    const d = await (await fetch(`/api/video_play/${id}`)).json();
    if (d.error) throw new Error(d.error);
    document.getElementById("videoPlayTitle").textContent = d.title || `视频 #${id}`;
    if (_hls) { _hls.destroy(); _hls = null; }
    if (el.canPlayType("application/vnd.apple.mpegurl")) {
      el.src = d.m3u8;                     // Safari 原生 HLS
    } else if (window.Hls && Hls.isSupported()) {
      _hls = new Hls();
      _hls.loadSource(d.m3u8);
      _hls.attachMedia(el);
    } else {
      throw new Error("浏览器不支持 HLS 播放");
    }
    el.play().catch(() => {});
  } catch (e) {
    document.getElementById("videoPlayTitle").textContent = "播放失败：" + e;
  }
}
function videoBackToList() {
  const el = document.getElementById("videoEl");
  el.pause(); el.removeAttribute("src"); el.load();
  if (_hls) { _hls.destroy(); _hls = null; }
  document.getElementById("videoPlayer").style.display = "none";
  document.getElementById("videoListWrap").style.display = "flex";
  document.getElementById("videoHead").textContent = "📺 视频课";
}
function closeVideos() {
  videoBackToList();
  document.getElementById("videoModal").style.display = "none";
}

// ===================== 全部研选文章（列表 → 点击用文章阅读弹窗） =====================
const _articles = { page: 0, items: [], busy: false, done: false };
async function showArticles() {
  document.getElementById("articleListModal").style.display = "flex";
  if (!_articles.items.length) {
    document.getElementById("articleList").innerHTML = '<div class="empty">加载中…</div>';
    await loadArticles(1);
  }
}
async function loadArticles(page) {
  if (_articles.busy || _articles.done || page <= _articles.page) return;
  _articles.busy = true;
  try {
    let d;
    try {
      d = await (await fetch(`/api/articles?page=${page}`)).json();
    } catch (e) { d = { error: String(e) }; }
    if (d.error) {
      document.getElementById("articleList").innerHTML =
        `<div class="empty">加载失败：${esc(d.error)}</div>`;
      return;
    }
    _articles.page = page;
    _articles.done = !d.hasNextPage;
    _articles.items = page > 1 ? _articles.items.concat(d.articles || []) : (d.articles || []);
    document.getElementById("articleTotal").textContent = d.total ? `共 ${d.total} 篇` : "";
    document.getElementById("articleList").innerHTML = _articles.items.length
      ? _articles.items.map(a => `
        <div class="vitem" title="${esc(a.articleTitle)}" onclick="openArticle(${a.id})">
          <div class="vbody">
            <div class="vtitle">${esc(a.articleTitle)}</div>
            <div class="vmeta">${esc((a.createTime || "").slice(0, 16))} · #${a.id}
              ${a.feeStatus ? ' · <span class="ac-tag">付费</span>' : ""}</div>
          </div>
        </div>`).join("")
      : '<div class="empty">还没有文章</div>';
    // 首屏没撑出滚动条就自动补下一页（setTimeout 等 busy 释放后再进）
    const abox = document.getElementById("articleList");
    if (abox.clientHeight > 0 && abox.scrollHeight <= abox.clientHeight && !_articles.done)
      setTimeout(() => loadArticles(_articles.page + 1), 0);
  } finally { _articles.busy = false; }
}
function closeArticleList() { document.getElementById("articleListModal").style.display = "none"; }

// ===================== 置顶消息（房间级，pinnedListById） =====================
let _pins = [];
async function loadPins() {
  try {
    const d = await (await fetch("/api/pinned")).json();
    _pins = d.pins || [];
  } catch (e) { _pins = []; }
  renderPins();
}
function pinSummary(p) {
  try {
    if (+p.msgType === 1) { JSON.parse(p.msgContent); return "📷 [图片]"; }
    if (+p.msgType === 2) { return "📄 " + (JSON.parse(p.msgContent).title || "文章"); }
  } catch (e) {}
  return String(p.msgContent || "").replace(/\s+/g, " ").slice(0, 80);
}
function renderPins() {
  const bar = document.getElementById("pinBar");
  if (!_pins.length) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  document.getElementById("pinCount").textContent = _pins.length;
  document.getElementById("pinCurr").textContent = pinSummary(_pins[0]);
  document.getElementById("pinPanel").innerHTML = _pins.map((p, i) => `
    <div class="pin-item" onclick="openPin(${i})">
      <div>${esc(pinSummary(p))}</div>
      <div class="pmeta">${esc((p.msgDate || "").slice(0, 16))}${p.feeStatus ? " · 付费" : ""}</div>
    </div>`).join("");
}
function togglePinPanel(force) {
  const panel = document.getElementById("pinPanel");
  const show = force != null ? force : panel.style.display !== "block";
  panel.style.display = show ? "block" : "none";
}
function openPin(i) {
  const p = _pins[i];
  try {
    if (+p.msgType === 1) { openLightbox(mediaUrl(JSON.parse(p.msgContent).imgUrl, "image")); return; }
    if (+p.msgType === 2) { openArticle(JSON.parse(p.msgContent).sourceId); return; }
  } catch (e) {}
  togglePinPanel(false);
  document.getElementById("pinTextBody").textContent = p.msgContent || "";
  document.getElementById("pinTextModal").style.display = "flex";
}
function closePinText() { document.getElementById("pinTextModal").style.display = "none"; }

function renderContent(m, kw) {
  // msgType: 0=文本 1=图片 2=文章推送卡片（老师发的早盘预案/知识点小结）
  if (m.msg_type === 2) return renderArticle(m);
  if (m.msg_type === 1) {
    const img = m.image || {};
    let url = img.url || "";
    if (!url) { try { url = JSON.parse(m.msg_content || "{}").imgUrl || ""; } catch (e) {} }
    if (!url) return '<span style="color:var(--muted)">[图片]</span>';
    const w = img.width || 0, h = img.height || 0;
    const box = (w && h) ? `style="aspect-ratio:${w}/${h}"` : "";
    const src = mediaUrl(url, "image");
    return `<span class="imgwrap"><img class="msgimg loading" ${box} src="${src}" loading="lazy"
              onclick="openLightbox('${src}')" onload="this.classList.remove('loading');onImgLoad(this)"
              onerror="this.classList.remove('loading');this.alt='[图片加载失败]';onImgLoad(this)"></span>`;
  }
  let text = m.msg_content || "";
  if (m.msg_type !== 0 && m.msg_type !== "0" && m.msg_type != null && m.msg_type !== "") {
    // 未知类型（语音/视频等）不要直接把原始 JSON 倒到界面上
    return `<span style="color:var(--muted)">[不支持的消息类型 ${esc(String(m.msg_type))}]</span>`;
  }
  if (kw) {
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    text = esc(text).replace(re, s => `<mark>${s}</mark>`);
    return text;
  }
  return esc(text);
}

function renderMsg(m, frag, kw) {
  const isTeacher = m.user_type === 4;
  const div = document.createElement("div");
  div.className = "msg" + (isTeacher ? " teacher" : "");
  div.dataset.mid = msgKey(m);
  div.dataset.uid = m.user_id || "";
  div.dataset.ts = m.ts || 0;

  const av = avatarUrl(m);
  const avatarHtml = av
    ? `<img class="avatar" src="${av}" loading="lazy"
         onclick="openLightbox('${av}')"
         onerror="this.outerHTML='<div class=&quot;avatar-ph&quot;>${firstChar(m.nick_name)}</div>'">`
    : `<div class="avatar-ph">${firstChar(m.nick_name)}</div>`;

  // 只保留数据上站得住的标记：
  //   老师   = user_type 3（网页版）/ 4（小程序时代）
  //   审核中 = auditStatus=0（仅 REST 权威数据会给出 0）
  // 不再显示“实时/VIP/私聊回复”：前两个字段在 IM 推送里是审核前的占位值
  // （实测 REST 里 14299 条全是 0），真正的“老师回复某人”信号是 toUserId>0。
  const tags = [];
  if (isTeacher) tags.push('<span class="tag t">老师</span>');
  if (isTeacher && m.to_user_id > 0) tags.push('<span class="tag r">回复</span>');
  if (m.audit_status === 0) tags.push('<span class="tag p">审核中</span>');

  const alias = nickCountCache[m.user_id] > 1 ? '<span class="alias-badge">曾</span>' : "";
  const quote = m.quote
    ? `<div class="quote" onclick="jumpToMessage('${esc(String(m.quote.id || ""))}')">
         <span class="q-nick">${esc(m.quote.nickName || "")}</span>：
         ${esc(m.quote.msgType === 1 ? "[图片]" : (m.quote.msgContent || "").slice(0, 60))}</div>`
    : "";

  div.innerHTML = `
    ${avatarHtml}
    <div class="body">
      <div class="meta">
        <span class="nick ${isTeacher ? "teacher-name" : ""}"
              onclick="filterByUser(${m.user_id || 0}, '${esc(m.nick_name || "")}')"
              onmouseenter="showNickInfo(event, ${m.user_id || 0})"
              onmouseleave="hideNickInfo()"
              title="点击只看 TA 的发言">${esc(m.nick_name || "匿名")}${alias}</span>
        ${m.yn_no ? `<span class="yn">${esc(m.yn_no)}</span>` : ""}
        ${tags.join("")}
        <span class="time">${searchMode ? fmtDateTime(m.msg_date) : fmtTime(m.msg_date)}</span>
      </div>
      ${quote}
      <div class="content">${renderContent(m, kw)}</div>
    </div>`;
  frag.appendChild(div);
}

function renderMessages(msgs, list, kw, followBottom) {
  const key = list.id;
  const old = _renderStates.get(key);
  if (old && old.observer) { old.observer.disconnect(); _renderStates.delete(key); }
  list.innerHTML = "";
  if (!msgs.length) {
    list.innerHTML = `<div class="empty">暂无消息<br>
      <span style="font-size:12px">未登录——去 <a href="/login" target="_blank">登录页</a>（扫码 / 账密）后再拉线上消息</span></div>`;
    return;
  }
  // 条数不多就一次性渲染完，然后直接贴底。
  // 以前一律分批 + “每批贴底”，在真实浏览器里不可靠：
  // .msg 用了 content-visibility:auto，scrollHeight 只是按 contain-intrinsic-size 的估算，
  // 贴底后元素真实高度生效→ scrollHeight 又变，于是停在中间（看到了早盘的 06:31）。
  if (msgs.length <= RENDER_ALL_MAX) {
    const frag = document.createDocumentFragment();
    const state = { lastDate: "" };
    msgs.forEach(m => {
      appendDaySep(frag, (m.msg_date || "").slice(0, 10), state);
      renderMsg(m, frag, kw);
    });
    list.appendChild(frag);
    loadNickCounts();
    if (followBottom) pinToBottom(list);
    return;
  }
  _renderStates.set(key, { msgs, list, index: 0, observer: null, kw, lastDate: "",
                           followBottom: !!followBottom });
  _renderBatch(key);
}

/** 贴到底部，并在懒渲染/图片撑开后再确认几次。只应在“加载完成/用户主动”时调用一次。
 *  注意：**不能**用 stickToBottom 做前置判断 —— 清空列表时浏览器夹回 scrollTop
 *  会触发一次 scroll 事件，监听器会把 stickToBottom 置 false，贴底就永远不执行了。
 */
const _pinning = { allList: false, teacherList: false };
const _follow = { allList: false, teacherList: false };   // 各栏各自的“是否跟随底部”

function pinToBottom(list) {
  if (!list) return;
  const id = list.id;
  _pinning[id] = true;
  const jump = () => { list.scrollTop = list.scrollHeight; };
  jump();
  requestAnimationFrame(jump);
  setTimeout(jump, 60);
  setTimeout(() => {
    jump();
    _follow[id] = true;
    _pinning[id] = false;
    if (id === "allList") {
      stickToBottom = true;
      pendingNew = 0;
      document.getElementById("newMsgHint").style.display = "none";
    }
  }, 260);
}

function _renderBatch(key) {
  const st = _renderStates.get(key);
  if (!st) return;
  const { msgs, list, kw } = st;
  const end = Math.min(st.index + MSG_BATCH, msgs.length);
  const frag = document.createDocumentFragment();
  for (let i = st.index; i < end; i++) {
    appendDaySep(frag, (msgs[i].msg_date || "").slice(0, 10), st);
    renderMsg(msgs[i], frag, kw);
  }
  list.appendChild(frag);
  st.index = end;
  loadNickCounts();
  if (st.index >= msgs.length) {
    // 全部渲染完：收回状态（否则滚动加载更早会一直不触发）。
    // 贴底只在「本次渲染本来就要贴底」时做一次——以前这里无条件 pinToBottom(allList)：
    //  ① st.followBottom 算了却没用，你已滚上去后又被重新打开“跟随”，于是又自己贴底；
    //  ② 写死 allList，左栏分批渲染完从不贴底，两栏行为还不一致。
    const wantPin = st.followBottom;
    st.followBottom = false;
    if (st.observer) { st.observer.disconnect(); st.observer = null; }
    _renderStates.delete(key);
    if (wantPin) pinToBottom(list);
    return;
  }
  const sentinel = document.createElement("div");
  sentinel.className = "render-sentinel";
  sentinel.style.height = "1px";
  list.appendChild(sentinel);
  if (!st.observer) {
    st.observer = new IntersectionObserver(es => {
      for (const e of es) {
        if (!e.isIntersecting) continue;
        e.target.remove();
        st.observer && st.observer.unobserve(e.target);
        if (_renderStates.get(key) === st) _renderBatch(key);
      }
    }, { root: list, rootMargin: "800px" });
  }
  st.observer.observe(sentinel);
}

// ===================== 头像/曾用名 =====================
async function loadNickCounts() {
  const need = new Set();
  document.querySelectorAll(".msg[data-uid]").forEach(el => {
    const uid = el.dataset.uid;
    if (uid && uid !== "0" && nickCountCache[uid] === undefined) need.add(uid);
  });
  if (!need.size) return;
  const uids = Array.from(need);
  try {
    const r = await fetch(`/api/users/batch?uids=${encodeURIComponent(uids.join(","))}`);
    const data = await r.json();
    for (const uid of uids) nickCountCache[uid] = (data[uid] && data[uid].nick_count) || 1;
  } catch (e) {
    for (const uid of uids) nickCountCache[uid] = 1;
  }
  document.querySelectorAll(".msg[data-uid]").forEach(el => {
    const uid = el.dataset.uid;
    const nick = el.querySelector(".nick");
    if (!nick || nick.querySelector(".alias-badge")) return;
    if (nickCountCache[uid] > 1) {
      const b = document.createElement("span");
      b.className = "alias-badge";
      b.textContent = "曾";
      nick.appendChild(b);
    }
  });
}

let _nickTimer = null;
async function showNickInfo(ev, uid) {
  if (!uid) return;
  clearTimeout(_nickTimer);
  _nickTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/api/users/${uid}`);
      const d = await r.json();
      hideNickInfo();
      const el = document.createElement("div");
      el.className = "nick-popup";
      el.id = "nickPopup";
      const nicks = (d.nicknames || []).slice(0, 8).map(n =>
        `<div class="pp-item"><span>${esc(n.nick_name)}</span>
         <span class="pp-time">${esc((n.last_seen || "").slice(0, 10))}</span></div>`).join("");
      el.innerHTML = `<div class="pp-title">${esc(d.nick_name || "")}
          ${d.yn_no ? "· " + esc(d.yn_no) : ""} · 共 ${d.msg_count || 0} 条</div>
        ${(d.nicknames || []).length > 1 ? '<div class="pp-title">曾用名</div>' + nicks : ""}
        ${d.avatar_url ? `<div style="margin-top:6px"><img src="${mediaUrl(d.avatar_url, "avatar")}"
            style="width:48px;height:48px;border-radius:5px;object-fit:cover"></div>` : ""}`;
      document.body.appendChild(el);
      const rect = ev.target.getBoundingClientRect();
      el.style.left = Math.min(rect.left, window.innerWidth - el.offsetWidth - 12) + "px";
      el.style.top = Math.min(rect.bottom + 6, window.innerHeight - el.offsetHeight - 12) + "px";
    } catch (e) {}
  }, 260);
}
function hideNickInfo() {
  clearTimeout(_nickTimer);
  const p = document.getElementById("nickPopup");
  if (p) p.remove();
}

// ===================== 加载数据 =====================
function buildQuery(extra) {
  const url = new URL("/api/messages", location.origin);
  if (INIT_ROOM) url.searchParams.set("room_id", INIT_ROOM);
  for (const k in extra) if (extra[k] !== "" && extra[k] != null) url.searchParams.set(k, extra[k]);
  return url;
}

function pad2(n) { return String(n).padStart(2, "0"); }
function fmtDayInput(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function todayStr() { return fmtDayInput(new Date()); }

/** 「重新加载当前视图」：日历选的那天 / 范围（近N天或全部） */
async function loadMessages() {
  if (currentDay) return loadDay(currentDay);
  return loadRange();
}

/** 范围模式：取最新的 PAGE_LOAD 条，落在底部（最新），滚到顶再补更早的 */
async function loadRange() {
  searchMode = false;
  currentDay = "";
  document.getElementById("clearBtn").classList.remove("show");
  const extra = { size: PAGE_LOAD, order: "desc" };
  if (currentRangeDays) extra.days = currentRangeDays;
  const d = await (await fetch(buildQuery(extra))).json();
  allMessages = d.messages || [];
  hasMoreHistory = !!d.has_more;
  oldestLoadedId = oldestIdOf(allMessages);
  seenKeys.clear();
  allMessages.forEach(m => seenKeys.add(msgKey(m)));
  stickToBottom = true;
  renderMessages(allMessages, document.getElementById("allList"), "", true);
  renderTopHint();
  updateCounts(d.total);
  loadTeacherColumn();
}

/** 日历模式：通读某一天（时间正序），默认落在当天最新处 */
async function loadDay(date) {
  currentDay = date;
  searchMode = false;
  document.getElementById("datePicker").value = date;
  document.querySelectorAll("[data-range]").forEach(b => b.classList.remove("active"));
  document.getElementById("todayBtn").classList.toggle("on", date === todayStr());
  const d = await (await fetch(buildQuery({ date, size: 8000, order: "asc" }))).json();
  if (!d.count) {
    // 这天没数据（例如过了午夜选“今天”、或选了非交易日）——给出明确的下一步
    const near = d.nearest_date || "";
    document.getElementById("allList").innerHTML =
      `<div class="empty">${date} 没有消息<br>
       <span style="font-size:12px">约牛只开放最近 7 天；也许今天还没开市</span>
       ${near ? `<br><br><button onclick="loadDay('${near}')">去看最近有数据的 ${near}</button>` : ""}</div>`;
    allMessages = []; hasMoreHistory = false; oldestLoadedId = 0;
    renderTopHint(); updateCounts(0);
    return;
  }
  allMessages = d.messages || [];
  hasMoreHistory = !!d.has_more;
  oldestLoadedId = oldestIdOf(allMessages);
  seenKeys.clear();
  allMessages.forEach(m => seenKeys.add(msgKey(m)));
  stickToBottom = true;
  renderMessages(allMessages, document.getElementById("allList"), "", true);
  renderTopHint();
  updateCounts(d.total);
  loadTeacherColumn();
}

function onDatePick() {
  const v = document.getElementById("datePicker").value;
  if (!v) return;
  if (v > todayStr()) { alert("还没到那天（约牛也只会给最近 7 天）"); return; }
  loadDay(v);
}

function shiftDay(delta) {
  const cur = currentDay || todayStr();
  const d = new Date(cur + "T12:00:00");
  d.setDate(d.getDate() + delta);
  const v = fmtDayInput(d);
  if (v > todayStr()) { alert("已经是今天了"); return; }
  loadDay(v);
}

function loadToday() { return loadDay(todayStr()); }

async function loadTeacherColumn() {
  const extra = { size: 800, order: "desc", type: "teacher" };
  if (currentDay) extra.date = currentDay;
  else if (currentRangeDays) extra.days = currentRangeDays;
  try {
    const d = await (await fetch(buildQuery(extra))).json();
    // 注意：API 对 order=desc 也会把结果反转为「时间正序」再返回（方便前端直接 append），
    // 这里以前又 .reverse() 了一次 → 变成新→旧，导致贴底后底部是早上 08:11 的文章卡片，
    // 而最新的老师消息被顶到看不见的顶部。
    teacherMessages = d.messages || [];
    renderMessages(teacherMessages, document.getElementById("teacherList"), "", true);
    document.getElementById("teacherCount").textContent = teacherMessages.length +
      (d.has_more ? "+ 条（仅显示最新部分）" : " 条");
  } catch (e) {}
}

function oldestIdOf(msgs) {
  for (const m of msgs) if (m.id) return m.id;
  return 0;
}

/** 向历史（更早）加载一页，接在列表顶部并保持滚动位置。 */
async function loadOlder() {
  if (loadingOlder || !hasMoreHistory || !oldestLoadedId) return;
  loadingOlder = true;
  const hint = document.getElementById("topHint");
  if (hint) hint.textContent = "加载更早…";
  try {
    const extra = { size: PAGE_OLDER, order: "desc", before_id: oldestLoadedId };
    if (currentDay) extra.date = currentDay;
    else if (currentRangeDays) extra.days = currentRangeDays;
    const d = await (await fetch(buildQuery(extra))).json();
    const older = d.messages || [];
    if (!older.length) { hasMoreHistory = false; }
    else {
      const list = document.getElementById("allList");
      const before = list.scrollHeight;
      const keep = list.scrollTop;
      // 取消可能还在跑的分批渲染，并保留已渲染节点
      const st = _renderStates.get(list.id);
      if (st && st.observer) { st.observer.disconnect(); st.observer = null; }
      const frag = document.createDocumentFragment();
      older.forEach(m => renderMsg(m, frag, searchKeyword));
      list.insertBefore(frag, list.firstChild);
      allMessages = older.concat(allMessages);
      older.forEach(m => seenKeys.add(msgKey(m)));
      oldestLoadedId = oldestIdOf(older) || oldestLoadedId;
      hasMoreHistory = !!d.has_more;
      list.scrollTop = keep + (list.scrollHeight - before);
      loadNickCounts();
      renderTopHint();
      updateCounts();
    }
  } catch (e) {
    console.warn("加载更早失败", e);
  } finally {
    loadingOlder = false;
    renderTopHint();
  }
}

function renderTopHint() {
  let hint = document.getElementById("topHint");
  const list = document.getElementById("allList");
  if (!hint) {
    hint = document.createElement("div");
    hint.id = "topHint";
    hint.className = "list-top-hint";
    list.insertBefore(hint, list.firstChild);
  }
  if (loadingOlder) { hint.textContent = "加载更早…"; return; }
  hint.innerHTML = hasMoreHistory
    ? `已加载 ${allMessages.length} 条 · <button onclick="loadOlder()">↑ 加载更早</button>`
    : `已到最早（共 ${allMessages.length} 条）`;
}

function updateCounts(total) {
  const el = document.getElementById("allCount");
  const scope = currentDay ? currentDay + "（日历）"
    : (currentRangeDays ? `近${currentRangeDays}天` : "全部");
  const t = (total != null) ? total : allMessages.length;
  // 把实际载入的时间范围也显示出来，一眼就能确认“看的是哪天”
  let span = "";
  if (allMessages.length) {
    const a = (allMessages[0].msg_date || "").slice(5, 16);
    const b = (allMessages[allMessages.length - 1].msg_date || "").slice(5, 16);
    span = ` · ${a} → ${b}`;
  }
  el.textContent = `${scope} · 已加载 ${allMessages.length} / ${t} 条${span}`;
}

async function doSearch() {
  const kw = document.getElementById("searchInput").value.trim();
  const uid = document.getElementById("userIdInput").value.trim();
  if (!kw && !uid) { clearSearch(); return; }
  const url = new URL("/api/messages/search", location.origin);
  if (kw) url.searchParams.set("keyword", kw);
  if (uid) url.searchParams.set("user_id", uid);
  const s = parseRange(document.getElementById("searchStart").value);
  const e = parseRange(document.getElementById("searchEnd").value);
  if (s) url.searchParams.set("start_date", s);
  if (e) url.searchParams.set("end_date", e);
  const r = await fetch(url);
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  searchMode = true;
  searchKeyword = kw;
  renderMessages(d.messages || [], document.getElementById("allList"), kw);
  document.getElementById("allCount").textContent = "搜索命中 " + (d.total || 0) + " 条";
  document.getElementById("clearBtn").classList.add("show");
}

function clearSearch() {
  searchMode = false;
  searchKeyword = "";
  document.getElementById("clearBtn").classList.remove("show");
  document.getElementById("searchInput").value = "";
  document.getElementById("userIdInput").value = "";
  renderMessages(allMessages, document.getElementById("allList"), "", stickToBottom);
  renderTopHint();
  updateCounts();
}

function filterByUser(uid, nick) {
  if (!uid) return;
  document.getElementById("userIdInput").value = uid;
  document.getElementById("searchInput").value = "";
  doSearch();
}

async function setRange(days) {
  currentRangeDays = days;
  currentDay = "";
  document.getElementById("datePicker").value = "";
  document.getElementById("todayBtn").classList.remove("on");
  document.querySelectorAll("[data-range]").forEach(b =>
    b.classList.toggle("active", String(days) === b.dataset.range));
  await loadRange();
}

// ===================== 定位 / 滚动 =====================
function listScrollTop() { return document.getElementById("allList").scrollTop; }
function scrollToBottom(instant) {
  // **只给用户主动动作（「回到底部」按钮 / 新消息提示）用**：同时贴两栏。
  // 自动跟随一律走 followList()，一次只动一栏。
  const al = document.getElementById("allList");
  const tl = document.getElementById("teacherList");
  al.scrollTop = al.scrollHeight;
  tl.scrollTop = tl.scrollHeight;
  _follow.allList = true;
  _follow.teacherList = true;
  pendingNew = 0;
  stickToBottom = true;
  document.getElementById("newMsgHint").style.display = "none";
}
function jumpTo(hhmm) {
  // 以当前列表里最新一条所在的那天为基准（默认看当天节奏）。
  // 以前用 toISOString() 取日期是 UTC，比本地早 8 小时会错一天，
  // 导致“同一天优先”那段永远不命中，只能靠 fallback 碰运气。
  const latest = allMessages.length ? allMessages[allMessages.length - 1] : null;
  const baseDate = (latest && latest.msg_date)
    ? latest.msg_date.slice(0, 10)
    : (currentDay || todayStr());
  const target = Math.floor(new Date(baseDate + "T" + hhmm + ":00").getTime() / 1000);
  if (!isFinite(target)) return;
  // 两栏都要跳：以前只对 allList 里的节点调 scrollIntoView，左栏纹丝不动
  const a = jumpColumnToTs(document.getElementById("allList"), target);
  const b = jumpColumnToTs(document.getElementById("teacherList"), target);
  if (!a && !b) return;
}

/** 把某一栏定位到「ts >= target 的第一条」；都比它早就回到顶部。返回是否命中。 */
function jumpColumnToTs(list, target) {
  if (!list) return false;
  for (const el of list.querySelectorAll(".msg[data-ts]")) {
    if (Number(el.dataset.ts || 0) >= target) {
      _follow[list.id] = false;      // 定位 = 主动离开底部，别让自动跟随又拽回去
      el.scrollIntoView({ block: "start" });
      el.classList.add("is-new");
      setTimeout(() => el.classList.remove("is-new"), 1800);
      return true;
    }
  }
  _follow[list.id] = false;
  list.scrollTop = 0;
  return false;
}
function jumpToMessage(mid) {
  if (!mid) return;
  const list = document.getElementById("allList");
  const el = list.querySelector(`.msg[data-mid="id:${mid}"]`) ||
             list.querySelector(`.msg[data-mid="${mid}"]`);
  if (!el) { alert("原消息不在当前列表中"); return; }
  el.scrollIntoView({ block: "center" });
  el.classList.add("is-new");
  setTimeout(() => el.classList.remove("is-new"), 1800);
}
function onImgLoad(el) {
  // 图片撑开只影响它自己所在的那一栏
  followList(el && el.closest ? el.closest(".msg-list") : null);
}

/** 自动跟随：**只动这一栏**，且只在这一栏本来就贴着底部时才动。
 *  反面教材（踩过两次）：用 stickToBottom（它只跟右栏）去驱动
 *  scrollToBottom()（它同时滚两栏）—— 你在左栏翻历史时，右栏每来一条
 *  实时消息就把左栏也拽回底部，表现就是“老师那栏隔一会儿自动贴底”。 */
function followList(list) {
  if (!list || !_follow[list.id] || _pinning[list.id]) return;
  list.scrollTop = list.scrollHeight;
}

// ===================== 发送 =====================
let pendingImage = null;

// ===================== 输入法（IME）合成处理 =====================
// 中文/日文输入法打字时，回车是「确认候选词」，不应该当成发送。
// 坑在事件顺序：Chromium（Edge/Chrome）是 compositionend → keydown，
// 所以处理 keydown 时 ev.isComposing 已经是 false 了，光判断它没用在。
// 三种信号一起用：
//   1) imeComposing      —— compositionstart 到 compositionend 之间
//   2) ev.isComposing / keyCode === 229 —— 标准与旧版信号（Safari/Firefox 顺序不同，这两个能币住）
//   3) 刚 compositionend 的极短宽限窗口 —— 专门币住 Chromium 那次确认回车
let imeComposing = false;
let imeEndedAt = 0;
const IME_GRACE_MS = 80;

// 挂在 document 上用捕获阶段，这样发送框/搜索框/设置里的输入框全都覆盖
for (const ev of ["compositionstart", "compositionend"]) {
  document.addEventListener(ev, e => {
    if (ev === "compositionstart") {
      imeComposing = true;
    } else {
      imeComposing = false;
      imeEndedAt = Date.now();
    }
  }, true);
}

/** 这次回车是不是「输入法确认候选词」。是就别 preventDefault，让输入法自己处理。 */
function isImeEnter(ev) {
  return imeComposing || ev.isComposing || ev.keyCode === 229 ||
         (Date.now() - imeEndedAt) < IME_GRACE_MS;
}

function onSendKeydown(ev) {
  if (ev.key !== "Enter" || ev.shiftKey) return;
  if (isImeEnter(ev)) return;      // 确认候选词的回车 → 只把它当普通输入
  ev.preventDefault();
  sendMsg();
}

function onSearchKeydown(ev) {
  if (ev.key !== "Enter") return;
  if (isImeEnter(ev)) return;
  ev.preventDefault();
  doSearch();
}
async function sendMsg() {
  const box = document.getElementById("sendInput");
  const btn = document.getElementById("sendBtn");
  const text = box.value.trim();
  if (!text && !pendingImage) return;
  btn.disabled = true;
  try {
    let body;
    if (text) body = { text };
    if (pendingImage && !text) body = { image: pendingImage };
    else if (pendingImage && text) {
      // 图文一起发：先发文字，再发图片（约牛 REST 一次只发一种）
      await fetch("/api/send", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }) });
      body = { image: pendingImage };
      box.value = "";
    }
    const r = await fetch("/api/send", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.error) { alert(d.error); return; }
    box.value = "";
    autoGrow(box);
    if (pendingImage) { clearImage(); }
    // 刚发出去的是自己那条（只出现在右栏）——只把右栏拉到底，别动左栏
    stickToBottom = true;
    _follow.allList = true;
    setTimeout(() => followList(document.getElementById("allList")), 400);
  } catch (e) {
    alert("发送失败：" + e);
  } finally {
    btn.disabled = false;
  }
}
async function uploadFile(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (f) await doUpload(f);
}
async function doUpload(file) {
  if (file.size > 2 * 1024 * 1024) { alert("图片超过 2MB，约牛 OSS 限制"); return; }
  const btn = document.getElementById("uploadBtn");
  btn.classList.add("uploading");
  try {
    const ext = (file.name.split(".").pop() || "png").toLowerCase();
    const r = await fetch(`/api/upload?ext=${ext}`, { method: "POST", body: file });
    const d = await r.json();
    if (d.error) { alert(d.error); return; }
    pendingImage = { imgUrl: d.imgUrl, width: d.width, height: d.height };
    showImagePreview(file);
  } catch (e) {
    alert("上传失败：" + e);
  } finally {
    btn.classList.remove("uploading");
  }
}
function showImagePreview(file) {
  const wrap = document.getElementById("imagePreview");
  const url = URL.createObjectURL(file);
  wrap.innerHTML = `<div class="thumb">
      <img src="${url}" onclick="openLightbox('${url}')">
      <span class="rm" onclick="clearImage()">✕</span>
    </div>`;
  wrap.classList.add("show");
}
function clearImage() {
  const img = document.querySelector("#imagePreview img");
  if (img && img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
  pendingImage = null;
  const wrap = document.getElementById("imagePreview");
  wrap.innerHTML = "";
  wrap.classList.remove("show");
}
document.addEventListener("paste", ev => {
  const items = (ev.clipboardData || {}).items || [];
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      const f = it.getAsFile();
      if (f) { doUpload(f); ev.preventDefault(); }
      return;
    }
  }
});

// ===================== 图片放大 =====================
(function initLightbox() {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");
  lb._zoom = 1; lb._dx = 0; lb._dy = 0;
  function apply() {
    img.style.transform = `scale(${lb._zoom}) translate(${lb._dx}px, ${lb._dy}px)`;
    if (lb._zoom > 1) {
      img.style.maxWidth = "none"; img.style.maxHeight = "none";
      img.style.transformOrigin = "top center";
    } else {
      img.style.maxWidth = "92vw"; img.style.maxHeight = "92vh";
      img.style.transformOrigin = "center center";
    }
  }
  lb.addEventListener("click", e => { if (e.target === lb) lb.style.display = "none"; });
  img.addEventListener("dblclick", e => { e.stopPropagation(); lb._zoom = 1; lb._dx = 0; lb._dy = 0; apply(); });
  lb.addEventListener("wheel", e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) lb._zoom = Math.max(.2, Math.min(12, lb._zoom * (e.deltaY < 0 ? 1.2 : .83)));
    else lb._dy -= e.deltaY / 5;
    apply();
  }, { passive: false });
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
  img.addEventListener("mousedown", e => {
    drag = true; sx = e.clientX; sy = e.clientY; ox = lb._dx; oy = lb._dy;
    img.classList.add("dragging"); e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!drag) return;
    lb._dx = ox + (e.clientX - sx); lb._dy = oy + (e.clientY - sy); apply();
  });
  document.addEventListener("mouseup", () => { drag = false; img.classList.remove("dragging"); });
})();
function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  lb._zoom = 1; lb._dx = 0; lb._dy = 0;
  document.getElementById("lightboxImg").src = src;
  lb.style.display = "flex";
}

});

// ===================== WebSocket 实时 =====================
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { wsRetry = 0; };
  ws.onmessage = ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === "message") { onRealtimeMessage(d.data); }
    else if (d.type === "status") { updateImStatus(d); }
    else if (d.type === "synced") {
      if (d.error) console.warn("同步失败：" + d.error);
      else onSyncProgress({ running: false, done: true, added: d.added || 0,
                            mode: d.mode,
                            detail: d.pages != null
                              ? `完成：${d.pages || 0} 次请求 ${d.fetched || 0} 条，新增 ${d.added || 0} 条`
                              : `已补拉 ${d.added || 0} 条` });
    }
    else if (d.type === "sync_progress") { onSyncProgress(d); }
    else if (d.type === "media_progress") { onMediaProgress(d); }
    else if (d.type === "event") {
      const hint = document.getElementById("newMsgHint");
      // 群提示（进出场）：仅记录，不打断阅读
      console.log("[群事件]", d.data);
    }
  };
  ws.onclose = () => {
    wsRetry++;
    setTimeout(connectWS, Math.min(1000 * Math.pow(1.6, wsRetry), 15000));
  };
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 45000);

/** 只有这两种视图弹「N 条新消息」：默认「最新」视图（没点任何范围按钮）和日历的「今天」。
 *  近3天/近7天/全部属于读历史的范围视图，新消息照常静默插进列表底部，但不弹提示。 */
function isLiveView() {
  if (searchMode) return false;
  if (currentDay) return currentDay === todayStr();
  return !document.querySelector("[data-range].active");
}

function onRealtimeMessage(m) {
  const key = msgKey(m);
  if (!key || seenKeys.has(key)) return;
  if (m.id && allMessages.some(x => x.id === m.id)) return;
  seenKeys.add(key);
  const isTeacherSide = (m.user_type === 3 || m.user_type === 4);

  // 只在「当前视图确实包含这条消息」时才插进列表。
  // 正在通读历史某天（或看搜索结果）时既不插列表、也不弹「N 条新消息」——
  // 消息后端已入库，切回今天自然能拉到，别打断阅读。
  const viewingLive = !searchMode && (!currentDay || currentDay === todayStr());
  if (!viewingLive) return;

  allMessages.push(m);
  allMessages.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  if (isTeacherSide) teacherMessages.push(m);

  const list = document.getElementById("allList");
  if (_renderStates.has(list.id)) {          // 分批渲染未结束时直接改数据源
    _renderStates.get(list.id).msgs = allMessages;
  }
  const frag = document.createDocumentFragment();
  renderMsg(m, frag, searchKeyword);
  const node = frag.firstElementChild;
  node.classList.add("is-new");
  setTimeout(() => node.classList.remove("is-new"), 1800);
  list.appendChild(node);
  if (isTeacherSide) {
    const tl = document.getElementById("teacherList");
    if (_renderStates.has(tl.id)) _renderStates.get(tl.id).msgs = teacherMessages;
    const f2 = document.createDocumentFragment();
    renderMsg(m, f2, "");
    tl.appendChild(f2.firstElementChild);
    document.getElementById("teacherCount").textContent = teacherMessages.length + " 条";
  }
  document.getElementById("allCount").textContent = "全部 " + allMessages.length + " 条";
  loadNickCounts();
  // 自动跟随只动「本来就贴底」的那一栏，另一栏保持用户的位置；
  // 以前这里是 if (stickToBottom) scrollToBottom(true) → 两栏一起被拽到底。
  followList(list);
  if (isTeacherSide) followList(document.getElementById("teacherList"));
  if (isLiveView() && !_follow.allList) {
    pendingNew++;
    const hint = document.getElementById("newMsgHint");
    document.getElementById("newMsgCount").textContent = pendingNew;
    hint.style.display = "block";
  }
}

function updateImStatus(d) {

async function loadStatus() {
  const r = await fetch("/api/status");
  const d = await r.json();
  if (d.room_id) {

  }
  myUserId = String(d.my_user_id || "");
  updateImStatus({ im_state: d.im.state, im_detail: d.im.detail });
  // 把后台自适应节奏显示在按钮 tooltip 上（IM 在线时故意拉得很长，不浪费请求）
  if (d.sync) {
    const iv = d.sync.interval || 0;
    window._syncIvText = `后台自动核对：每 ${iv ? iv + " 秒" : "-"}（${d.sync.interval_reason || "-"}）`;
  }
  // 同步进度（刷新页面时如果后台还在跑，也能接上；后台增量不轮询不打扰）
  if (d.sync && d.sync.running && d.sync.mode !== "incremental") {
    onSyncProgress(d.sync); startSyncPolling();
  }
  else if (d.sync && d.sync.detail && !d.sync.running && d.sync.done) hideSyncBar();
  const banner = document.getElementById("warnBanner");
  const warns = [];
  if (!d.has_token) warns.push('未登录（只能浏览本地已同步消息）');
  if (!d.im.state || d.im.state === "off") warns.push("实时消息未启用");
  if (d.im.state === "login_failed") warns.push("IM 凭证失效（userSig 过期）");
  if (d.token && d.token.warn) {
    warns.push(`centraltoken 已用 ${fmtDur(d.token.age_sec)}，`
      + `已接近历史寿命（中位 ${fmtDur(d.token.lifetime_median)}），建议重新登录`);
  }
  if (warns.length) {
    banner.innerHTML = "⚠️ " + warns.join(" · ")
      + ' · <a href="/login">去登录 ↗</a>';
    banner.classList.add("show");
    document.getElementById("main").classList.add("with-banner");
  } else {
    banner.classList.remove("show");
    document.getElementById("main").classList.remove("with-banner");
  }
  return d;
}

async function _postSync(body, hint) {
  const r = await fetch("/api/sync", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(body) });
  const d = await r.json();
  if (d.error) {
    // 409 = 已有同步在跑（多半是后台自动核对撞上了）：
    // 别只弹窗就走，直接把进度条挂到那个正在跑的任务上。
    if (r.status === 409 && d.state && d.state.running) {
      showSyncBar(hint);
      onSyncProgress(d.state);
      startSyncPolling();
      return true;
    }
    if (r.status === 401) { alert(d.error); location.href = "/login"; return false; }
    alert(d.error); return false;
  }
  showSyncBar(hint);
  startSyncPolling();
  return true;
}

/** 全量：一直翻到最早（拿到多少存多少，页面会实时显示进度） */
async function syncFull() {

             + "大约 1 分钟，期间可以继续浏览。开始吗？")) return;
  await _postSync({ full: true, page_size: 1000, max_messages: 200000 }, "全量同步中…");
}

function showSyncBar(text) {
  document.getElementById("syncText").textContent = text || "同步中…";
  document.getElementById("syncBar").classList.add("show");
}
function hideSyncBar() {
  document.getElementById("syncBar").classList.remove("show");
}

// 进度轮询兜底：WebSocket 断了（后端重启、休眠唤醒）进度条也能继续走。
// 只在消息同步的入口启动；媒体下载共用这条进度条，别把它挂到这上面。
let _syncPollTimer = null;
function startSyncPolling() {
  if (_syncPollTimer) return;
  _syncPollTimer = setInterval(async () => {
    let d;
    try { d = await (await fetch("/api/sync/state")).json(); }
    catch (e) { return; }                       // 服务暂时不可达：下个周期再试
    if (d.running) onSyncProgress(d);
    else if (d.done) { stopSyncPolling(); onSyncProgress(d); }
  }, 2000);
}
function stopSyncPolling() {
  if (_syncPollTimer) { clearInterval(_syncPollTimer); _syncPollTimer = null; }
}

/** 同步进度（WebSocket 的 sync_progress 驱动，轮询兜底）。
 *  后台增量（mode=incremental：启动自动拉 / IM 重连补漏 / 无 IM 兜底轮询）完全不在
 *  界面显示——进度条和重渲染都会打扰阅读，后台日志里有记录就够了。
 *  唯一例外：增量真找到新消息（added>0）时仍然刷新视图/弹提示。 */
let _lastFinishAt = 0;
function onSyncProgress(p) {
  const bg = p.mode === "incremental";
  if (!p.running && p.done) {
    if (bg && !(p.added > 0)) return;         // 后台增量 0 新增：彻底安静
    document.getElementById("syncText").textContent = p.detail || "同步完成";
    document.getElementById("syncFill").style.width = "100%";
    // 没有新增就到此为止：收尾广播为 0 条新增整页重渲染（老师栏滚动被重置——"抽搐"的来源）。
    if (!(p.added > 0)) { if (!bg) setTimeout(hideSyncBar, 4000); return; }
    // 有新增时，完成时刻后端会连发多帧（sync_history 收尾、synced 结果、_bg 收尾），
    // 刷新视图这类副作用 5 秒窗口内只做一次——否则连打 3 对 /api/messages。
    if (Date.now() - _lastFinishAt < 5000) return;
    _lastFinishAt = Date.now();
    if (!bg) setTimeout(hideSyncBar, 4000);
    // 你已经滚上去在翻历史时不要重载当前视图 —— 重载会重新渲染并按「切换视图」
    // 的规则贴到底，看起来就是“过一会儿又自己跳到底了”。新消息本来就会由 IM 推过来。
    if (_follow.allList) loadMessages();
    else if (isLiveView()) {
      // 只有「最新/今天」视图弹提示；范围视图和历史日期一律安静
      pendingNew++;
      document.getElementById("newMsgCount").textContent = pendingNew;
      document.getElementById("newMsgHint").style.display = "block";
    }
    return;
  }
  if (bg) return;                             // 后台增量进行中：不显示进度条
  showSyncBar();
  const pages = p.pages || 0, fetched = p.fetched || 0;
  document.getElementById("syncText").textContent =
    `${p.detail || "同步中"}  ·  ${pages} 次请求 / ${fetched} 条`;
  // 无确定终点：按已取条数给个视觉进度（50 页 / 50000 条为满）
  document.getElementById("syncFill").style.width =
    Math.min(99, Math.max(2, (pages / 50) * 100)) + "%";
}

    (total ? Math.min(100, Math.round(cur / total * 100)) : 2) + "%";
}

async function showStats() {
  const r = await fetch("/api/stats");
  const d = await r.json();
  const m = await loadMediaStatus() || {};
  const mb = ((m.bytes || 0) / 1048576).toFixed(1);
  const mediaRow = m.total
    ? `<div><b>图片本地化</b>${m.images} / ${m.images_total}</div>
       <div><b>头像本地化</b>${m.avatars} / ${m.avatars_total}</div>
       <div><b>媒体占用</b>${mb} MB（${m.dir || "data/cache"}）</div>
       <div><b>离线可用</b>${m.missing ? `还差 ${m.missing} 个` : "✅ 已完整，可断网查看"}</div>`
    : "";
  let s = null;
  try { s = await (await fetch("/api/status")).json(); } catch (e) { /* 拿不到就少一行，不影响统计 */ }
  const syncRow = (s && s.sync)
    ? `<div><b>后台核对节奏</b>每 ${s.sync.interval || "-"} 秒（${s.sync.interval_reason || "-"}）</div>`
    : "";
  const tk = s && s.token;
  const tokRow = (tk && tk.set_at)
    ? `<div><b>centraltoken</b>签发于 ${tk.set_at}（来源 ${tk.source || "?"}）</div>
       <div><b>已用</b>${fmtDur(tk.age_sec)}${tk.samples ? ` · 预计还能 ${fmtDur(tk.eta_sec)}` : ""}</div>
       <div><b>历史寿命</b>${tk.samples
          ? `${tk.samples} 次过期实测：短 ${fmtDur(tk.lifetime_min)} / 中位 ${fmtDur(tk.lifetime_median)} / 长 ${fmtDur(tk.lifetime_max)}`
          : `还没有过期样本——下次真过期会自动记下来，之后就能预判`}</div>`
    : "";
  document.getElementById("statsKv").innerHTML = `
    <div><b>总消息</b>${d.total} 条</div>
    <div><b>老师消息</b>${d.teacher} 条</div>
    <div><b>图片</b>${d.images} 张</div>
    <div><b>发言用户</b>${d.users} 人</div>
    <div><b>时间跨度</b>${d.first || "-"} ~ ${d.last || "-"}</div>${tokRow}${syncRow}${mediaRow}`;
  document.getElementById("statsTable").innerHTML = (d.days || [])
    .map(x => `<tr><td>${x.date || "-"}</td><td>${x.teacher}</td><td>${x.count}</td></tr>`).join("");
  document.getElementById("statsModal").style.display = "flex";
}
function closeStats() { document.getElementById("statsModal").style.display = "none"; }

// ===================== centraltoken 寿命 =====================
function fmtDur(sec) {
  if (!sec) return "-";
  const h = sec / 3600;
  if (h < 1) return Math.round(sec / 60) + " 分钟";
  if (h < 48) return h.toFixed(1) + " 小时";
  return (h / 24).toFixed(1) + " 天";
}

// ===================== 启动 =====================
connectWS();
// loadToday 以前是同步函数（返回 undefined），这里链式 .then 会直接抛 TypeError，
// 把后面的 loadMediaStatus / setInterval 全部带崩。现在让它返回 Promise，并各自抛不误。
loadToday().catch(e => console.warn("加载今日失败：", e)).finally(loadStatus);
loadPins();                      // 置顶是房间级的，启动拉一次即可
loadMediaStatus();               // 与消息加载无关，单独发起
setInterval(() => { loadStatus(); }, 30000);
</script>
